# Job: run pods to completion. Retries on failure.
# --- Document 1: simple one-off job ---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: example
spec:
  backoffLimit: 4 # retries before marking Failed
  activeDeadlineSeconds: 600 # hard time limit for the whole job
  ttlSecondsAfterFinished: 3600 # auto-delete after completion
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: OnFailure # Jobs require OnFailure or Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo migrating && sleep 5"]
---
# --- Document 2: parallel indexed job ---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-indexed
  namespace: example
spec:
  completionMode: Indexed # each pod gets JOB_COMPLETION_INDEX (0..completions-1)
  completions: 10
  parallelism: 3 # pods running at once
  backoffLimitPerIndex: 2 # per-index retries (stable in 1.33)
  maxFailedIndexes: 3 # fail the job after this many failed indexes
  suspend: false # true = create no pods until resumed
  podFailurePolicy: # react to specific exit codes / conditions
    rules:
      - action: FailJob # don't retry on a known fatal exit code
        onExitCodes:
          containerName: worker
          operator: In
          values: [42]
      - action: Ignore # don't count disruptions toward backoffLimit
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    spec:
      restartPolicy: Never # required with podFailurePolicy
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo processing shard $JOB_COMPLETION_INDEX"]
