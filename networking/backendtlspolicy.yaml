# BackendTLSPolicy (Gateway API, standard channel in v1.7): TLS from the Gateway to a backend
# Service (re-encryption / mTLS-less verification of the upstream).
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: web-backend-tls
  namespace: example # must be in the same namespace as the targeted Service
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: web
      sectionName: https # optional: a named Service port
  validation:
    hostname: web.example.svc.cluster.local # name to verify and use as SNI
    caCertificateRefs: # CA bundle(s) in ConfigMaps in the same namespace
      - group: ""
        kind: ConfigMap
        name: internal-ca
    # Alternative: wellKnownCACertificates: System
