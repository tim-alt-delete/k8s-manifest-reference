# ResourceQuota: caps aggregate consumption in a namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: example
spec:
  hard:
    requests.cpu: "10" # sum of all pod CPU requests
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "50" # object count quotas
    services: "10"
    services.loadbalancers: "1"
    persistentvolumeclaims: "20"
    requests.storage: 200Gi
    count/deployments.apps: "20"
    count/configmaps: "50"
  # scopeSelector limits which pods are counted (e.g. only high priority ones)
  # scopeSelector:
  #   matchExpressions:
  #     - scopeName: PriorityClass
  #       operator: In
  #       values: ["high"]
