# ServiceAccount: identity for pods talking to the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: example
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/app # cloud workload identity example
automountServiceAccountToken: false # opt in per pod instead
imagePullSecrets: # added to every pod using this SA
  - name: registry-creds
secrets: # legacy; tokens now come from projected volumes
  - name: app-sa-token
