# StorageClass: describes a tier of storage and how to provision it. Cluster-scoped.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "false" # "true" makes it the cluster default
provisioner: ebs.csi.aws.com # CSI driver; use the one for your platform
parameters: # driver-specific
  type: gp3
  fsType: ext4
reclaimPolicy: Delete # Delete | Retain (for dynamically provisioned PVs)
volumeBindingMode: WaitForFirstConsumer # or Immediate; Wait respects pod topology
allowVolumeExpansion: true
mountOptions:
  - noatime
