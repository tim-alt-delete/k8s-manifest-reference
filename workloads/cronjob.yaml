# CronJob: creates a Job on a schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: example
spec:
  schedule: "0 2 * * *" # min hour dom month dow (also @daily, @hourly)
  timeZone: Etc/UTC # IANA zone; defaults to kube-controller-manager's zone
  concurrencyPolicy: Forbid # Allow | Forbid (skip if still running) | Replace
  startingDeadlineSeconds: 300 # skip run if it can't start within this window
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate: # a full Job spec
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "date; echo generating report"]
              resources:
                requests: {cpu: 100m, memory: 64Mi}
