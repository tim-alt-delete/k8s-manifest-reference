# Deployment: manages ReplicaSets for stateless apps; rolling updates and rollback.
# `spec.template.spec` is a full Pod spec: see workloads/pod.yaml for every pod field.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: example
  labels:
    app.kubernetes.io/name: web
  annotations:
    kubernetes.io/change-cause: "bump to 1.27" # shown in `rollout history`
spec:
  replicas: 3 # omit if an HPA manages scale
  revisionHistoryLimit: 5 # old ReplicaSets kept for rollback
  minReadySeconds: 10 # pod must be ready this long to count as available
  progressDeadlineSeconds: 600 # mark rollout failed after this
  paused: false
  selector: # immutable; must match template labels
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate # or Recreate (kill all, then start new)
    rollingUpdate:
      maxSurge: 25% # extra pods above replicas during update (int or %)
      maxUnavailable: 0 # pods allowed to be down during update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      serviceAccountName: app-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      volumes:
        - name: tmp
          emptyDir: {}
---
# Recreate strategy variant: use for apps that cannot run two versions at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-recreate
  namespace: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-recreate
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-recreate
    spec:
      containers:
        - name: web
          image: nginx:1.27
