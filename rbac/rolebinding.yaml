# RoleBinding: grants a Role/ClusterRole to subjects within one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader-binding
  namespace: example
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: example # required for ServiceAccount subjects
  - kind: User
    name: jane@example.com
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: dev-team
    apiGroup: rbac.authorization.k8s.io
roleRef: # immutable
  kind: Role # Role or ClusterRole
  name: app-reader
  apiGroup: rbac.authorization.k8s.io
