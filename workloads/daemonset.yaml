# DaemonSet: one pod per (matching) node. Typical: log agents, CNI, node exporters.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: example
spec:
  minReadySeconds: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  updateStrategy:
    type: RollingUpdate # or OnDelete
    rollingUpdate:
      maxUnavailable: 1 # nodes updated at once
      maxSurge: 0 # alternatively surge a new pod before killing the old (maxUnavailable must be 0)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
    spec:
      priorityClassName: system-node-critical
      nodeSelector: # restrict which nodes run it
        kubernetes.io/os: linux
      tolerations: # run on tainted nodes too (e.g. control plane)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - operator: Exists # tolerate everything
      hostPID: false
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: varlog
          hostPath: # access to the node filesystem: avoid unless required
            path: /var/log
            type: Directory
