# Secret: sensitive data. Base64 is encoding, NOT encryption: enable encryption at rest,
# restrict RBAC, and prefer external secret managers for real values.
# All values here are FAKE placeholders.
# --- Opaque (generic) ---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: example
type: Opaque
stringData: # plain text input; server stores it base64 in `data`
  username: app
  password: not-a-real-password
data: # base64 values
  token: bm90LWEtcmVhbC10b2tlbg==
immutable: true
---
# --- TLS certificate (used by Ingress) ---
apiVersion: v1
kind: Secret
metadata:
  name: example-tls
  namespace: example
type: kubernetes.io/tls # requires tls.crt and tls.key
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE-WITH-REAL-CERT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE-WITH-REAL-KEY
    -----END PRIVATE KEY-----
---
# --- Image pull credentials (imagePullSecrets) ---
# Normally generated: kubectl create secret docker-registry registry-creds ...
apiVersion: v1
kind: Secret
metadata:
  name: registry-creds
  namespace: example
type: kubernetes.io/dockerconfigjson # requires .dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.example.com":{"username":"user","password":"not-real","auth":"dXNlcjpub3QtcmVhbA=="}}}'
---
# --- Basic auth ---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: example
type: kubernetes.io/basic-auth # keys: username, password
stringData:
  username: admin
  password: not-a-real-password
---
# --- SSH auth ---
apiVersion: v1
kind: Secret
metadata:
  name: ssh-key
  namespace: example
type: kubernetes.io/ssh-auth # requires ssh-privatekey
stringData:
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE-WITH-REAL-KEY
    -----END OPENSSH PRIVATE KEY-----
---
# --- ServiceAccount token (long-lived; prefer short-lived TokenRequest / projected tokens) ---
apiVersion: v1
kind: Secret
metadata:
  name: app-sa-token
  namespace: example
  annotations:
    kubernetes.io/service-account.name: app-sa # controller fills in the token
type: kubernetes.io/service-account-token
